name: Update profile stats

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 00:30 UTC (06:00 IST)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["scripts/generate_stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          # Optional: add a repo secret STATS_TOKEN (classic PAT with "repo" + "read:user")
          # to include private-repo commits and languages. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
