<svg xmlns="http://www.w3.org/2000/svg" width="350" height="195" viewBox="0 0 350 195" role="img" aria-label="Most used languages">
<title>Most used languages</title>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 600; fill: #60A5FA; }
  .label { font-size: 14px; fill: #94A3B8; }
  .value { font-size: 14px; font-weight: 700; fill: #E2E8F0; }
  .small { font-size: 11px; fill: #94A3B8; }
  .fade { animation: fade .6s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes grow { from { stroke-dashoffset: var(--len); } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="349" height="194" rx="12" fill="#0B1220" stroke="#1E293B"/>
<text x="25" y="38" class="title">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="58" width="300" height="10" rx="5"/></clipPath><g clip-path="url(#bar)">
<rect x="25.00" y="58" width="209.06" height="10" fill="#f1e05a"/>
<rect x="233.56" y="58" width="64.96" height="10" fill="#b07219"/>
<rect x="298.03" y="58" width="22.05" height="10" fill="#a91e50"/>
<rect x="319.58" y="58" width="5.92" height="10" fill="#3572A5"/>
</g>
<g class="fade" style="animation-delay:150ms" transform="translate(25,98)"><circle cx="5" cy="-5" r="5" fill="#f1e05a"/><text x="16" y="0" class="value" style="font-weight:600">JavaScript</text><text x="135" y="0" class="label" text-anchor="end">69.5%</text></g>
<g class="fade" style="animation-delay:270ms" transform="translate(185,98)"><circle cx="5" cy="-5" r="5" fill="#b07219"/><text x="16" y="0" class="value" style="font-weight:600">Java</text><text x="135" y="0" class="label" text-anchor="end">21.5%</text></g>
<g class="fade" style="animation-delay:390ms" transform="translate(25,126)"><circle cx="5" cy="-5" r="5" fill="#a91e50"/><text x="16" y="0" class="value" style="font-weight:600">EJS</text><text x="135" y="0" class="label" text-anchor="end">7.2%</text></g>
<g class="fade" style="animation-delay:510ms" transform="translate(185,126)"><circle cx="5" cy="-5" r="5" fill="#3572A5"/><text x="16" y="0" class="value" style="font-weight:600">Python</text><text x="135" y="0" class="label" text-anchor="end">1.8%</text></g>
</svg>
